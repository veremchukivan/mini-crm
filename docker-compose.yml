services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini_crm_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - mini_crm_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: mini_crm_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mini_crm_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mini_crm_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mini_crm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mini_crm_network

  redis:
    image: redis:alpine
    container_name: mini_crm_redis
    restart: unless-stopped
    networks:
      - mini_crm_network

networks:
  mini_crm_network:
    driver: bridge

volumes:
  db_data:
